<?xml version="1.0" encoding="UTF-8"?>
<!--
  sickPDF S monogram — canonical editable maskable artwork (launcher size).

  The monogram is a single continuous folded-ribbon S: one spine, drawn with a
  round cap and round joins, so the shape stays unbroken at every size and has
  no self-intersections or detached terminals.

  Sizing: the S is 44.5 x 51 dp with a max radius of 30.98 dp from the icon
  centre. That is ~67% of the 66dp Android safe-circle width, leaving 2.02dp of
  clearance inside the guaranteed-safe circle and 5.02dp inside the 72dp area
  that circular/squircle launcher masks can reveal. Nothing is clipped.

  This file is the 108dp adaptive-launcher rendering. The splash asset uses the
  same shape at its own scale (see ic_splash_logo.xml) because the splash mask
  and layout have different breathing-room requirements.

  Geometry is generated by tools/generate_launcher_icons.py; keep them in sync.

  Colours: charcoal #202321 background, teal #147D73 monogram, white fold cue.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">sickPDF S monogram</title>
  <desc id="desc">A bold teal folded-ribbon S on a charcoal background.</desc>

  <rect width="108" height="108" fill="#202321"/>

  <!-- Continuous folded-ribbon S: one spine, 14dp round-capped round-joined stroke. -->
  <path fill="none" stroke="#147D73" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        d="M69.25,40 C69.25,35.5 65.25,35.5 59.25,35.5 C51.25,35.5 44.25,38 41.25,44 C38.75,49 41.25,54 47.25,57 C55.25,60 63.25,62 66.25,67 C69.25,71 66.25,72.5 60.25,72.5 C52.25,72.5 44.25,70 40.25,65"/>

  <!-- Small paper-fold cue, tucked inside the upper ribbon. -->
  <path fill="#FFFFFF" d="M59,31.5 L66.5,31.5 L63.5,38.5 L56,38.5 Z"/>
</svg>
